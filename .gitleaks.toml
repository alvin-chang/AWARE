# Gitleaks configuration for AWARE
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
#
# We use gitleaks to scan for accidentally-committed secrets. Some
# files in this repo contain tokens, JWTs, and password hashes that
# are KNOWN FALSE POSITIVES - they are test fixtures, sample data,
# or example values in documentation, not real production secrets.
# This file tells gitleaks to ignore them.
#
# Test fixtures in `test/` and `tests/` that intentionally set
# env-var names matching real Modal token names - the test code
# is checking the env-var-parsing logic, not the token value.
# Allowlist the entire test directory.

[allowlist]
description = "AWARE-specific allowlist for known-false-positive files"
paths = [
    # Test fixtures with placeholder token names - not real secrets
    # (test code references env var names like MODAL_TOKEN_ID to exercise
    # the env-var-parsing logic; the var names are not secret values)
    '''test/unit/trainer/modal-client.test.js''',
    '''test/unit/trainer/index\.test\.js''',
    '''test/unit/coordinator/index\.test\.js''',
    '''test/unit/config/index\.test\.js''',
    # k8s deployment manifest with placeholder secret
    '''k8s-deployment\.yaml''',
    # Performance test with example JWT
    '''tests/performance/load\.test\.js''',
    # Architecture doc with example secret in prose
    '''docs/architecture-findings\.md''',
    # PRM cache: field name 'distinct_keys_24h' matches 'generic-api-key'
    # because the line has the word 'keys' + a number suffix. Not a secret.
    '''src/db/prm-cache\.js''',
    # src/config/index.cjs: legitimately references env-var names like
    # MODAL_TOKEN_ID, PROVIDER_API_KEY, etc. as STRINGS (the names are
    # public; only the values would be secrets). Plus host paths under
    # the author's $REPO_PARENT/... which are also legitimate
    # documentation in this file.
    '''src/config/index\.cjs''',
    # src/trainer/modal-client.js: similarly references env-var names
    # as strings (preflight env-var checks). Not actual secrets.
    '''src/trainer/modal-client\.js''',
    # Seed-data TEMPLATES (NOT real seed data - the .json files
    # are gitignored and generated by scripts/seed-dev-*.js)
    '''src/data/users\.json\.template''',
    '''src/data/agents\.json\.template''',
    # Documented history of the anti-pattern (explains the
    # rewrite - Finding 1, 2 in the [date-redacted] private-data audit)
    '''docs/security/history-rewrites\.md''',
    # Filter-hooks test fixtures (literal banned patterns by design -
    # used to verify the BLOCK behavior of the privacy filter)
    '''tests/security/filter-hooks\.test\.js''',
    # CI/script files that contain the rule's OWN regex patterns as
    # literals - gitleaks matches the rule against the rule definition,
    # producing false positives. The patterns in these files are
    # intended; they're what we scan FOR, not what we want to block.
    '''scripts/hooks/pre-commit''',
    '''scripts/hooks/pre-push''',
    '''scripts/hooks/pre-receive''',
    '''scripts/pre-commit-check\.sh''',
    '''\.gitea/workflows/lint-private-data\.yml''',
    # Working-tree-only artifacts that can never be pushed (gitignored
    # or git-internal) but still get scanned by the Layer 2 pre-push
    # hook's full-tree gitleaks scan. The privacy filter cares about
    # content that could ship to GitHub, not local state.
    # - security-audit-gitleaks.json: prior audit report with rule regex literals
    # - *.bak: backup files (also gitignored via backup convention)
    # - data/prm-probe-cron*: local probe-cron log artifacts (worktree only)
    # - eval-results/daily-prm-probes/*: local PRM eval data (worktree only)
    # - SECURITY-FINDINGS-INTEGRATION-*.md: prior integration doc with file paths
    # v2.8.0 vendor-copy of heavy-think — the vendored source legitimately
    # references its own private-system host paths (e.g. ~/.openclaw/openclaw.json,
    # ~/.openclaw/audit/rlm/security.jsonl) in source comments + seccomp config.
    # These are documentation strings, not credentials; the host path is the
    # location of openclaw's runtime config, not a secret value. Don't sanitize
    # the vendored source — diverges from upstream. The host-path strings
    # match the aware-host-path-disclosure rule but are intentional context.
    # Per Archimedes verdict a633528b, the vendor is upstream-exact.
    '''backend/heavy-think/.*''',
    # v2.8.0 vendor-copy of heavy-think — VENDORED.md is the
    # provenance/procedure record. It deliberately documents the BEFORE
    # values (\`~/.openclaw/openclaw.json\`, \`MINIMAX_API_KEY\`) so a
    # reviewer can see what the sanitizer changed. These are inside
    # markdown backticks as documentation strings, NOT host-path leaks of
    # real secrets — the rewrite is documented, not the leak.
    '''backend/heavy-think/VENDORED\.md''',
    # scripts/sanitize-vendor-for-gh.sh — the sanitization script itself
    # contains the literal BEFORE-pattern strings as sed targets so it can
    # replace them. This is the same false-positive pattern as the pre-
    # commit hooks: the script CONTAINS its own detection patterns.
    # Pattern: CI tool that operates on strings will trigger the rule
    # against its own rules.
    '''scripts/sanitize-vendor-for-gh\.sh''',

    '''security-audit-gitleaks\.json''',
    '''.*\.bak''',
    '''data/prm-probe-cron.*''',
    '''eval-results/daily-prm-probes/.*''',
    '''SECURITY-FINDINGS-INTEGRATION-.*\.md''',
    # Git-internal recovery files (lost-found) — never pushed, scanned
    # only because Layer 2 does a full working-tree scan.
    '''\.git/lost-found/.*''',
    # Plain-text audit report (gitleaks matches its own rule regex as
    # content — same false-positive pattern as the JSON audit report).
    '''security-audit-report\.txt''',
    # Webpack cache files — embed absolute host paths in their packed
    # content (compile cache hits include the resolved file path).
    # Local-only artifacts, gitignored, never pushed.
    '''src/ui/node_modules/\.cache/.*''',
    # Coverage tool temp files — same pattern (path leakage from
    # source-map paths). Local-only, gitignored, never pushed.
    '''coverage/tmp/.*''',
    # node_modules blanket — every npm package under src/ui/node_modules
    # gets scanned but vendor READMEs / type defs embed resolved host
    # paths in their content. Gitignored wholesale, never pushed.
    '''.*/node_modules/.*''',
    # Python __pycache__ compiled bytecode — local-only, gitignored.
    '''.*__pycache__/.*''',
    # Coverage HTML reports embed resolved host paths in anchors
    # (file:// links to the source). Gitignored wholesale, never pushed.
    '''coverage/.*\.html''',
    # A1.1 close-out (2026-06-28): config/rlm.yaml + docs/rlm.md reference
    # ~/.openclaw/... paths to the symphony-v3 review workspace and the
    # INBOX notes. These are intentional internal-review cross-refs, not
    # public-facing docs. The repo is on GitHub but these files are not
    # intended for external readers — they document the review-trail
    # provenance for the G1→A1.1 revision cycle. Allowlisting is scoped
    # to the two files added in the A1.1 commit only; future revisions
    # that add host-path refs should re-evaluate whether the disclosure
    # is intentional.
    '''config/rlm\.yaml''',
    '''docs/rlm\.md''',
    # .gitleaks.toml itself: the aware-host-path-disclosure rule's regex
    # appears in its own definition AND in the allowlist comments above
    # (which intentionally describe the host paths being allowlisted).
    # Same self-referential false-positive pattern as the pre-commit-hook
    # scripts allowlisted above. Allowlisting is scoped to .gitleaks.toml
    # only; future rule additions that match external content should
    # NOT piggyback on this entry.
    '''\.gitleaks\.toml''',
] 

# Custom rules for patterns that gitleaks' default ruleset doesn't catch.
# These were added after the [date-redacted] private-data audit found
# fixture data shipped in the public repo (src/data/users.json +
# src/data/agents.json). The shape of those JSON files is the
# anti-pattern: future contributors who swap example.com for real
# data would have committed real hashes, invisible to default gitleaks.
[[rules]]
id = "aware-agent-credential-hash"
description = "64-char hex string in an agent credentials.current field"
regex = '''"current"\s*:\s*"[a-f0-9]{64}"'''
tags = ["aware", "agent-credential", "fixture-pattern"]
keywords = ["current"]

[[rules]]
id = "aware-user-password-hash"
description = "128-char hex SHA-512 passwordHash + 64-char hex salt pair in users.json shape"
regex = '''"passwordHash"\s*:\s*"[a-f0-9]{128}"\s*,\s*"salt"\s*:\s*"[a-f0-9]{64}"'''
tags = ["aware", "user-credential", "fixture-pattern"]
keywords = ["passwordHash", "salt"]

# Block LAN IP disclosures in documentation and config files
[[rules]]
id = "aware-lan-ip-disclosure"
description = "Private LAN IP addresses (192.168.x.x, 10.x.x.x) committed to public docs"
regex = '''\b(192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3})\b'''
tags = ["aware", "info-disclosure", "lan-ip"]

# Block host-username path disclosures in documentation
[[rules]]
id = "aware-host-path-disclosure"
description = "Host-specific paths under /Users/ or ~/.* leaked to public docs"
regex = '''(/Users/[a-z]+/|\.aws/|\.ssh/|\.kube/|~/\.[a-z]+/)'''
tags = ["aware", "info-disclosure", "host-path"]
