# Gitleaks configuration for AWARE
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
#
# We use gitleaks to scan for accidentally-committed secrets. Some
# files in this repo contain tokens, JWTs, and password hashes that
# are KNOWN FALSE POSITIVES — they are test fixtures, sample data,
# or example values in documentation, not real production secrets.
# This file tells gitleaks to ignore them.
#
# Test fixtures in `test/` and `tests/` that intentionally set
# env-var names matching real Modal token names — the test code
# is checking the env-var-parsing logic, not the token value.
# Allowlist the entire test directory.

[allowlist]
description = "AWARE-specific allowlist for known-false-positive files"
paths = [
    # Test fixtures with placeholder token names — not real secrets
    # (test code references env var names like MODAL_TOKEN_ID to exercise
    # the env-var-parsing logic; the var names are not secret values)
    '''test/unit/trainer/modal-client.test.js''',
    '''test/unit/trainer/index\.test\.js''',
    '''test/unit/coordinator/index\.test\.js''',
    '''test/unit/config/index\.test\.js''',
    # k8s deployment manifest with placeholder secret
    '''k8s-deployment\.yaml''',
    # Performance test with example JWT
    '''tests/performance/load\.test\.js''',
    # Architecture doc with example secret in prose
    '''docs/architecture-findings\.md''',
    # PRM cache: field name 'distinct_keys_24h' matches 'generic-api-key'
    # because the line has the word 'keys' + a number suffix. Not a secret.
    '''src/db/prm-cache\.js''',
    # src/config/index.cjs: legitimately references env-var names like
    # MODAL_TOKEN_ID, MINIMAX_API_KEY, etc. as STRINGS (the names are
    # public; only the values would be secrets). Plus host paths under
    # the author's $REPO_PARENT/... which are also legitimate
    # documentation in this file.
    '''src/config/index\.cjs''',
    # src/trainer/modal-client.js: similarly references env-var names
    # as strings (preflight env-var checks). Not actual secrets.
    '''src/trainer/modal-client\.js''',
    # Seed-data TEMPLATES (NOT real seed data — the .json files
    # are gitignored and generated by scripts/seed-dev-*.js)
    '''src/data/users\.json\.template''',
    '''src/data/agents\.json\.template''',
    # Documented history of the anti-pattern (explains the
    # rewrite — Finding 1, 2 in the 2026-06-23 private-data audit)
    '''docs/security/history-rewrites\.md''',
    # Filter-hooks test fixtures (literal banned patterns by design —
    # used to verify the BLOCK behavior of the privacy filter)
    '''tests/security/filter-hooks\.test\.js''',
    # CI/script files that contain the rule's OWN regex patterns as
    # literals — gitleaks matches the rule against the rule definition,
    # producing false positives. The patterns in these files are
    # intended; they're what we scan FOR, not what we want to block.
    '''scripts/hooks/pre-commit''',
    '''scripts/hooks/pre-push''',
    '''scripts/hooks/pre-receive''',
    '''scripts/pre-commit-check\.sh''',
    '''\.gitea/workflows/lint-private-data\.yml''',
]

# Custom rules for patterns that gitleaks' default ruleset doesn't catch.
# These were added after the 2026-06-23 private-data audit found
# fixture data shipped in the public repo (src/data/users.json +
# src/data/agents.json). The shape of those JSON files is the
# anti-pattern: future contributors who swap example.com for real
# data would have committed real hashes, invisible to default gitleaks.
[[rules]]
id = "aware-agent-credential-hash"
description = "64-char hex string in an agent credentials.current field"
regex = '''"current"\s*:\s*"[a-f0-9]{64}"'''
tags = ["aware", "agent-credential", "fixture-pattern"]
keywords = ["current"]

[[rules]]
id = "aware-user-password-hash"
description = "128-char hex SHA-512 passwordHash + 64-char hex salt pair in users.json shape"
regex = '''"passwordHash"\s*:\s*"[a-f0-9]{128}"\s*,\s*"salt"\s*:\s*"[a-f0-9]{64}"'''
tags = ["aware", "user-credential", "fixture-pattern"]
keywords = ["passwordHash", "salt"]

# Block LAN IP disclosures in documentation and config files
[[rules]]
id = "aware-lan-ip-disclosure"
description = "Private LAN IP addresses (192.168.x.x, 10.x.x.x) committed to public docs"
regex = '''\b(192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3})\b'''
tags = ["aware", "info-disclosure", "lan-ip"]

# Block host-username path disclosures in documentation
[[rules]]
id = "aware-host-path-disclosure"
description = "Host-specific paths under /Users/ or ~/.* leaked to public docs"
regex = '''(/Users/[a-z]+/|\.aws/|\.ssh/|\.kube/|~/\.[a-z]+/)'''
tags = ["aware", "info-disclosure", "host-path"]
