# Kubernetes deployment configuration for AWARE
# This configuration can be used to deploy AWARE to a Kubernetes cluster

---
# Backend Service — SEC-006:
# type changed from LoadBalancer to ClusterIP. LoadBalancer exposed the
# v1 backend API directly to the public internet depending on the cluster
# config. The frontend (and any external callers) should reach the backend
# through an Ingress that terminates TLS and enforces auth at the edge.
apiVersion: v1
kind: Service
metadata:
  name: aware-backend-service
  labels:
    app: aware-backend
spec:
  selector:
    app: aware-backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aware-backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aware-backend
  template:
    metadata:
      labels:
        app: aware-backend
    spec:
      containers:
      - name: aware-backend
        image: aware-backend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DISCOVERY_PORT
          value: "41234"
        - name: BROADCAST_PORT
          value: "41235"
        - name: API_PORT
          value: "3000"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: aware-secrets
              key: secret-key
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Frontend Service — SEC-006: LoadBalancer → ClusterIP. The
# frontend is now served via Ingress (TLS terminated at the edge).
apiVersion: v1
kind: Service
metadata:
  name: aware-frontend-service
  labels:
    app: aware-frontend
spec:
  selector:
    app: aware-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aware-frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aware-frontend
  template:
    metadata:
      labels:
        app: aware-frontend
    spec:
      containers:
      - name: aware-frontend
        image: aware-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_API_URL
          value: "http://aware-backend-service:3000/api"

---
# Secret for sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: aware-secrets
type: Opaque
data:
  # SEC-006: the previous
  # placeholder secret value `eW91cl9zZWNyZXRfa2V5X2hlcmU=` decoded to
  # 'your_secret_key_here' (a trivially-forgeable JWT signing key).
  # The committed manifest must NOT carry a real or guessable secret.
  # Provision the real secret via kubectl, NOT via this file:
  #
  #   kubectl create secret generic aware-secrets \
  #     --from-literal=secret-key="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
  #
  # Then leave this data: block empty in the committed manifest (or
  # delete the Secret stanza entirely and have the Deployment reference
  # an externally-provisioned secret). Operators who provision via
  # sealed-secrets / external-secrets / vault are also fine.
  # secret-key: <set via kubectl, not in this committed manifest>
---
# SEC-006: NetworkPolicy
# default-deny + per-service allowlist. Without NetworkPolicy, every
# pod in the namespace can talk to every other pod (Kubernetes
# default). A compromised pod gets free lateral movement. The
# default-deny below blocks all ingress + egress; the explicit
# allowlist below re-allows only the specific frontend→backend path
# the system needs. Add more allowlists as new services come online.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aware-default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aware-allow-frontend-to-backend
spec:
  podSelector:
    matchLabels:
      app: aware-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: aware-frontend
      ports:
        - protocol: TCP
          port: 3000
