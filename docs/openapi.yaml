openapi: 3.0.0
info:
  title: AWARE API
  description: API documentation for the AWARE - Autonomous Warehouse Automated Resource Engine system
  version: 1.1.0
  contact:
    name: AWARE Team
    email: aware@example.com
servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.aware-system.com
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Node:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [connected, disconnected, leader, follower]
        address:
          type: string
        lastSeen:
          type: string
          format: date-time
        capabilities:
          type: array
          items:
            type: string
    ClusterStatus:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        leader:
          type: string
        term:
          type: integer
        health:
          type: string
          enum: [healthy, degraded, unhealthy]
    Alert:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        resolved:
          type: boolean
    Resource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        status:
          type: string
        utilization:
          type: number
        allocatedTo:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
    TierPromotion:
      type: object
      description: >-
        AWARE v2 event payload emitted when an agent's trust tier is upgraded.
        Consumed by RiskMandate.ai to drive Mandate creation. The connector
        contract: on receipt of a 202 response, AWARE coordinator SHOULD call
        RiskMandate POST /v2/mandates with a MandateCreate referencing this
        event's `id` as `triggering_event_id`.
      additionalProperties: false
      required:
        - id
        - agent_id
        - from_tier
        - to_tier
        - promoted_by
        - promoted_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this promotion event.
        agent_id:
          type: string
          description: The AWARE agent identity whose tier is changing.
        from_tier:
          type: string
          enum: [T0, T1, T2, T3, T4]
          description: Tier the agent is moving from.
        to_tier:
          type: string
          enum: [T0, T1, T2, T3, T4]
          description: Tier the agent is moving to.
        promoted_by:
          type: string
          description: Principal (user/service-account) that authorised the tier change.
        capabilities_added:
          type: array
          description: Granular PBOM delta — the capabilities the agent gains at the new tier.
          items:
            type: string
        promoted_at:
          type: string
          format: date-time
          description: RFC3339 timestamp of when the promotion was applied.
        request_id:
          type: string
          format: uuid
          description: >-
            Idempotency/dedup token. RiskMandate echoes this on the resulting
            Mandate so AWARE can correlate the acceptance with the originating
            event across retries.
        metadata:
          type: object
          description: Free-form context bag. Closed at the root object; the metadata sub-object itself allows any keys for now.
          additionalProperties: false
    Mandate:
      type: object
      description: >-
        AWARE acceptance record. Carries the human underwriter(s), the
        framework controls those underwriters work under, and a bounded
        direction set. `expiry` is always required (AWARE has no standing
        grants; anything that should persist must be renewed). Deny is
        intentionally absent from `direction` — the contract is to bound the
        agent's envelope, not to refuse it.
      additionalProperties: false
      required:
        - grant_id
        - granted_by
        - scope
        - expiry
        - interval
        - direction
        - underwriters
        - triggering_event_type
        - triggering_event_id
      properties:
        grant_id:
          type: string
          format: uuid
          description: Server-generated unique grant identifier.
        granted_by:
          type: string
          description: Owner principal who recorded the acceptance.
        scope:
          type: array
          description: Capability identifiers covered by this grant.
          items:
            type: string
        expiry:
          type: string
          format: date-time
          description: >-
            RFC3339 expiry timestamp. Required on every Mandate — AWARE has
            no standing-grant concept; grants that should persist must be renewed.
        interval:
          type: string
          enum: [1h, 4h, 1d, 1w, 1m, 6m]
          description: Re-evaluation cadence.
        direction:
          type: string
          enum: [get_more_data, reduce, increase, hold]
          description: >-
            AWARE's bounded direction set. Deliberately omits `deny` — the
            contract is to constrain the agent's envelope, not to refuse it.
            Owner call (pending): if the AWARE policy-delta shape replaces
            this field, the schema will carry `prior_capability_deltas`
            directly and `direction` will be removed.
        underwriters:
          type: array
          description: >-
            Principals (technical, security, GRC) who underwrote this grant.
            Minimum 1; the "no executive accepts alone" invariant is enforced
            by an out-of-band policy check, not by the schema.
          minItems: 1
          items:
            type: string
        control_ids:
          type: array
          description: >-
            Framework-specific control IDs the underwriter's authority
            derives from (e.g. AICM `IAM-01`, `AC-09`, `DSP-02`; OWASP
            `LLM01`–`LLM10`; ISO `A.9.x`/`A.12.x`/`A.16.x`). These are the
            policy binding the human `underwriters` work under, NOT a
            standalone human list. The set is dynamic — new controls are
            registered via `src/compliance/framework-mapper.js`, which is
            the single source of truth for which framework IDs are
            currently recognised.
          items:
            type: string
        lethal_trifecta_flag:
          type: boolean
          description: >-
            True when the agent now combines: reads untrusted content AND
            reaches the public internet AND takes actions on its own. AWARE
            computes this from the capabilities delta on the triggering
            TierPromotion.
        triggering_event_type:
          type: string
          enum: [tier_promotion, pre_tool_block, cascade_revoke, spawn_request]
          description: Kind of AWARE event that prompted this Mandate.
        triggering_event_id:
          type: string
          description: ID of the AWARE event (e.g. TierPromotion.id) that triggered this Mandate.
        created_at:
          type: string
          format: date-time
          description: RFC3339 timestamp the Mandate was created.
    MandateCreate:
      type: object
      description: >-
        Request shape for POST /v2/mandates. Subset of Mandate — the server
        generates `grant_id` and `created_at`, the client supplies the rest.
      additionalProperties: false
      required:
        - granted_by
        - scope
        - expiry
        - interval
        - direction
        - underwriters
        - triggering_event_type
        - triggering_event_id
      properties:
        granted_by:
          type: string
        scope:
          type: array
          items:
            type: string
        expiry:
          type: string
          format: date-time
        interval:
          type: string
          enum: [1h, 4h, 1d, 1w, 1m, 6m]
        direction:
          type: string
          enum: [get_more_data, reduce, increase, hold]
        underwriters:
          type: array
          minItems: 1
          items:
            type: string
        control_ids:
          type: array
          description: >-
            Framework-specific control IDs the underwriter's authority
            derives from (e.g. AICM `IAM-01`, `AC-09`, `DSP-02`; OWASP
            `LLM01`–`LLM10`; ISO `A.9.x`/`A.12.x`/`A.16.x`). The set is
            dynamic — see `src/compliance/framework-mapper.js` for the
            registered control IDs.
          items:
            type: string
        lethal_trifecta_flag:
          type: boolean
        triggering_event_type:
          type: string
          enum: [tier_promotion, pre_tool_block, cascade_revoke, spawn_request]
        triggering_event_id:
          type: string
    MandateResponse:
      type: object
      description: >-
        Response shape for POST /v2/mandates. Extends Mandate with
        `agent_constraint_tier` so the AWARE coordinator can record which
        of the five T0–T4 constraint tiers the accepting agent holds after
        the mandate resolution.
      additionalProperties: false
      required:
        - grant_id
        - granted_by
        - scope
        - expiry
        - interval
        - direction
        - underwriters
        - triggering_event_type
        - triggering_event_id
        - agent_constraint_tier
      properties:
        grant_id:
          type: string
          format: uuid
        granted_by:
          type: string
        scope:
          type: array
          items:
            type: string
        expiry:
          type: string
          format: date-time
        interval:
          type: string
          enum: [1h, 4h, 1d, 1w, 1m, 6m]
        direction:
          type: string
          enum: [get_more_data, reduce, increase, hold]
        underwriters:
          type: array
          minItems: 1
          items:
            type: string
        control_ids:
          type: array
          items:
            type: string
        lethal_trifecta_flag:
          type: boolean
        triggering_event_type:
          type: string
          enum: [tier_promotion, pre_tool_block, cascade_revoke, spawn_request]
        triggering_event_id:
          type: string
        created_at:
          type: string
          format: date-time
        agent_constraint_tier:
          type: string
          enum: [T0, T1, T2, T3, T4]
          description: >-
            AWARE constraint tier the agent holds after this mandate
            resolution. Maps to the five-tier system defined in
            `src/server.js` (see README.md "T0–T4 constraint levels"):
            T0 audit-trail, T1 crypto-identity, T2 guardrailed,
            T3 policy-driven, T4 autonomous. Server-set; clients read but
            do not supply. Supersedes the previous `ramm_level` integer
            (removed in 1.1.0 — RM vocabulary did not belong on an AWARE
            response object).

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      role:
                        type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /register:
    post:
      summary: User registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/paths/~1login/post/responses/200/content/application~1json/schema'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/cluster/status:
    get:
      summary: Get cluster status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cluster status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/cluster/config:
    get:
      summary: Get cluster configuration
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cluster config
          content:
            application/json:
              schema:
                type: object
    put:
      summary: Update cluster configuration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Config updated

  /api/cluster:
    post:
      summary: Create new cluster
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Cluster created

  /api/cluster/metrics:
    get:
      summary: Get cluster metrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                type: object

  /api/cluster/events:
    get:
      summary: Get cluster events
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/cluster/scale-up:
    post:
      summary: Scale cluster up
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Scale up initiated

  /api/cluster/scale-down:
    post:
      summary: Scale cluster down
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Scale down initiated

  /api/nodes:
    get:
      summary: Get all nodes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
    post:
      summary: Add new node
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
      responses:
        '201':
          description: Node added

  /api/nodes/{id}:
    get:
      summary: Get specific node
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
    put:
      summary: Update node
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Node updated
    delete:
      summary: Remove node
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node removed

  /api/nodes/{id}/health-check:
    post:
      summary: Trigger node health check
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Health check initiated

  /api/alerts:
    get:
      summary: Get all alerts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
    post:
      summary: Create new alert
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Alert'
      responses:
        '201':
          description: Alert created

  /api/alerts/{id}:
    get:
      summary: Get specific alert
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alert details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
    put:
      summary: Update alert
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Alert'
      responses:
        '200':
          description: Alert updated
    delete:
      summary: Delete alert
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alert deleted

  /api/resources:
    get:
      summary: Get all resources
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
    post:
      summary: Create new resource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resource'
      responses:
        '201':
          description: Resource created

  /api/resources/{id}:
    get:
      summary: Get specific resource
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resource details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
    put:
      summary: Update resource
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resource'
      responses:
        '200':
          description: Resource updated
    delete:
      summary: Delete resource
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resource deleted

  /v2/tier-promotions:
    post:
      summary: Emit a tier-promotion event (AWARE v2)
      description: >-
        AWARE coordinator calls this endpoint when an agent's trust tier
        is upgraded. The payload is an event, not a synchronous command:
        202 Accepted indicates the event was recorded; downstream Mandate
        creation is performed by the AWARE coordinator via a separate
        POST to RiskMandate /v2/mandates. This endpoint is the contract
        surface shared with RiskMandate.ai and any other consumer that
        needs to react to tier changes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TierPromotion'
      responses:
        '202':
          description: >-
            Tier promotion event accepted. The server has recorded the
            event; downstream Mandate creation is the coordinator's
            responsibility.
          content:
            application/json:
              schema:
                type: object
                properties:
                  event_id:
                    type: string
                    format: uuid
                    description: Echoes the TierPromotion.id for client correlation.
                  accepted_at:
                    type: string
                    format: date-time
        '400':
          description: Malformed event payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/mandates:
    post:
      summary: Create a Mandate acceptance (RiskMandate.ai v2)
      description: >-
        Records a RiskMandate acceptance in response to an AWARE event
        (typically a TierPromotion). The AWARE coordinator invokes this
        on the back of a successful POST /v2/tier-promotions, supplying
        the original event's id as triggering_event_id. Idempotency is
        enforced server-side via the client-supplied triggering_event_id:
        a 409 response indicates a Mandate already exists for that event.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MandateCreate'
      responses:
        '201':
          description: Mandate created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateResponse'
        '400':
          description: Malformed MandateCreate payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            A Mandate already exists for this triggering_event_id
            (idempotency guard). The existing grant is returned in the
            body so the client can reconcile without re-creating.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateResponse'

security:
  - bearerAuth: []
